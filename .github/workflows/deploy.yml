name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          NODE_ENV: production
        # El basePath se infiere del nombre del repo a partir de GITHUB_REPOSITORY
        # (que tiene el formato "owner/repo-name"), asi no se rompe si se renombra.
        # GitHub Pages siempre sirve bajo https://<user>.github.io/<repo-name>/.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "Building with basePath=/$REPO_NAME"
          NEXT_PUBLIC_BASE_PATH="/$REPO_NAME" npx next build --webpack

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
